version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - host-network

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - host-network
      - secure-internal
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - secure-internal
      - ollama-download

  sandbox:
    build: ./sandbox
    networks:
      - secure-internal

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 64
        reservations:
          cpus: '0.25'
          memory: 128M

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp:size=64M,mode=1777,exec
      - /home/sandboxuser/.cache:size=32M,mode=700

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_data:

networks:
  host-network:
    driver: bridge

  secure-internal:
    driver: bridge
    internal: true

  ollama-download:
    driver: bridge