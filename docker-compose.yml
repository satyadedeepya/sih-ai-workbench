# PERSON 6: DEVOPS, SANDBOX & SECURITY LEAD
# 
# TODOs for docker-compose.yml:
# 1. Define all services: Frontend, Backend, Ollama, VectorDB, Sandbox.
# 2. Configure internal Docker networks to ensure NO external internet access for the Workbench.
# 3. Mount necessary GPU drivers for Ollama.

version: '3.8'

services:
  # UI
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - secure-internal

  # API & Agent
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - secure-internal
    depends_on:
      - ollama

  # Local LLM Server
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - secure-internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Code Execution Sandbox (Isolated)
  sandbox:
    build: ./sandbox
    networks:
      secure-internal:
        # Crucial for Person 6: Prevent this specific container from accessing external networks
        # (The entire internal network should ideally be isolated as well)
        aliases:
          - sandbox

    # Resource limits - prevent DoS attacks via CPU/memory/process exhaustion
    deploy:
      resources:
        limits:
          cpus: '1.0'              # Max 1 CPU core
          memory: 512M             # Max 512MB RAM (hard limit, container killed if exceeded)
          pids: 64                 # Max 64 processes (prevents fork bombs)
        reservations:
          cpus: '0.25'             # Guaranteed minimum 25% CPU
          memory: 128M             # Guaranteed minimum 128MB RAM

    # Security hardening
    cap_drop:
      - ALL                        # Drop all Linux capabilities (no raw packets, no chroot, no device creation)

    security_opt:
      - no-new-privileges:true     # Prevent privilege escalation via setuid/setgid

    read_only: true                # Read-only root filesystem (prevents persistent malware, disk exhaustion)

    # Writable tmpfs mounts (in-memory, size-limited, non-persistent)
    tmpfs:
      - /tmp:size=64M,mode=1777,exec    # System temp directory (world-writable with sticky bit)
      - /home/sandboxuser/.cache:size=32M,mode=700  # Python cache directory

    # Health check (enables dependency ordering and auto-restart on failure)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Auto-restart on crash (unless manually stopped)
    restart: unless-stopped

    # Log rotation (prevents disk exhaustion via log spam)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"            # Max 10MB per log file
        max-file: "3"              # Keep max 3 files (30MB total)

volumes:
  ollama_data:

networks:
  secure-internal:
    internal: true # This makes the network fully air-gapped!
